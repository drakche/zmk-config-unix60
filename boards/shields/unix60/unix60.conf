# Optional settings for the Unix60. Everything commented out is off by
# default; uncomment what you want.
#
# ZMK Studio is enabled per-build in build.yaml (it also needs the
# studio-rpc-usb-uart snippet), so it is deliberately not set here.

# Run the nRF52's low-frequency clock from the internal RC oscillator instead
# of the external 32.768 kHz crystal, which is the board default.
#
# BLE connection timing is derived from this clock. A nice!nano whose crystal
# is absent, badly soldered or out of spec keeps its link but drifts out of
# its receive windows, which the host sees as the keyboard randomly dropping
# and reconnecting while the battery still reads full. The RC oscillator is
# always present on the die, so selecting it rules the crystal out.
#
# This fixed it: the disconnects stopped from the first flash and have not
# come back over several days of normal wireless use, so the crystal on this
# board really is marginal. Leave it on.
#
# The trade is accuracy: RC is 500 ppm against the crystal's 20 ppm, so the
# radio holds wider receive windows and idle current rises slightly. Periodic
# recalibration (CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION) switches on with it.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Advertise a different name per Bluetooth profile, so five paired hosts do
# not all show up as "Unix60". Implemented in src/bluetooth_profile_name.c;
# bt_set_name() refuses to do anything without DYNAMIC.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32

# Deep sleep after 15 minutes idle. Without this the board only reaches the
# light idle state at ZMK_IDLE_TIMEOUT (30 s), which shuts the display down but
# leaves the radio and the matrix scan running, so a keyboard left disconnected
# keeps draining. ZMK_SLEEP defaults to n, so it has to be asked for.
#
# Deep sleep powers the matrix down and stops advertising, dropping idle draw
# to microamps. The cost is the wake: the first keypress wakes the board and is
# swallowed, and a Bluetooth host takes a second or two to reconnect after it.
# ZMK_IDLE_SLEEP_TIMEOUT already defaults to 900000; it is spelled out here so
# the number is visible next to the behaviour it controls.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
